name: Build ImmortalWrt Mainline RG-X60 New (107MiB)

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Ignore ccache for this build"
        required: true
        default: false
        type: boolean
      ssh_debug:
        description: "Open tmate only when the build fails"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mainline-rg-x60-new-107m-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_REPO: https://github.com/immortalwrt/immortalwrt.git
  OPENWRT_BRANCH: master
  OPENWRT_DIR: openwrt
  PROFILE: ruijie_rg-x60-new-mtkuboot
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
  TZ: Asia/Taipei

jobs:
  build:
    name: Build mainline RG-X60-new 107MiB
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout build definitions
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Restore apt package cache
        uses: actions/cache/restore@v4
        id: apt-cache
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.os }}-v1-${{ hashFiles('.github/workflows/build-mainline-rg-x60-new-107m.yml') }}
          restore-keys: |
            apt-archives-${{ runner.os }}-v1-

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -euo pipefail
          # Keep downloaded .deb files in a user-owned cache directory so
          # actions/cache can restore and save them.
          mkdir -p "$HOME/apt-archives/partial"
          # apt drops to the _apt user for downloads; let it write partial files.
          sudo chown _apt "$HOME/apt-archives/partial" || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            -o Acquire::Retries=3 \
            autoconf automake autopoint binutils bison build-essential bzip2 \
            ccache clang cmake cpio curl device-tree-compiler file flex g++ gawk \
            gcc-multilib g++-multilib gettext git gperf help2man intltool jq \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libgnutls28-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev lld llvm \
            ninja-build p7zip-full patch pkgconf python3 python3-docutils \
            python3-ply python3-pyelftools python3-setuptools re2c rsync \
            scons squashfs-tools swig texinfo time uglifyjs unzip wget xsltproc \
            xxd zlib1g-dev zstd
          # Give the cache directory back to the runner user (apt ran as root).
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
          sudo apt-get clean

      - name: Save apt package cache
        if: ${{ steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.os }}-v1-${{ hashFiles('.github/workflows/build-mainline-rg-x60-new-107m.yml') }}

      - name: Clone ImmortalWrt mainline
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --single-branch --branch "$OPENWRT_BRANCH" \
            "$OPENWRT_REPO" "$OPENWRT_DIR"
          cd "$OPENWRT_DIR"
          source_sha=$(git rev-parse HEAD)
          source_short=$(git rev-parse --short=8 HEAD)
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$source_short" >> "$GITHUB_OUTPUT"
          echo "SOURCE_COMMIT=$source_sha" > ../source-info.env
          echo "SOURCE_SHORT_SHA=$source_short" >> ../source-info.env
          git log -1 --oneline

      - name: Restore source download cache
        uses: actions/cache/restore@v4
        id: dl-cache
        with:
          path: openwrt/dl
          key: mainline-rgx60new-107m-dl-${{ runner.os }}-${{ steps.source.outputs.sha }}
          restore-keys: |
            mainline-rgx60new-107m-dl-${{ runner.os }}-
            mainline-rgx60new-107m-dl-

      # OpenWrt skips host tools and the toolchain when their stamps exist in
      # staging_dir. Caching those directories removes the ~40 min tools and
      # gcc/musl rebuild on later runs of the same source commit and defconfig.
      - name: Restore host tools and toolchain cache
        if: ${{ inputs.clean_build == false }}
        uses: actions/cache/restore@v4
        id: toolchain-cache
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/toolchain-*
          key: mainline-rgx60new-107m-toolchain-${{ runner.os }}-${{ steps.source.outputs.sha }}-${{ hashFiles('defconfig/mainline-rg-x60-new-107m.config') }}
          restore-keys: |
            mainline-rgx60new-107m-toolchain-${{ runner.os }}-${{ steps.source.outputs.sha }}-

      - name: Restore compiler cache
        if: ${{ inputs.clean_build == false }}
        uses: actions/cache/restore@v4
        id: ccache-cache
        with:
          path: openwrt/.ccache
          key: mainline-rgx60new-107m-ccache-${{ runner.os }}-${{ steps.source.outputs.sha }}-${{ hashFiles('defconfig/mainline-rg-x60-new-107m.config', 'files/**', 'mainline/**', 'scripts/**', '.github/workflows/build-mainline-rg-x60-new-107m.yml') }}
          restore-keys: |
            mainline-rgx60new-107m-ccache-${{ runner.os }}-${{ steps.source.outputs.sha }}-
            mainline-rgx60new-107m-ccache-${{ runner.os }}-

      - name: Apply RG-X60-new 107MiB mainline board support
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/apply-mainline-rg-x60-new.sh "$OPENWRT_DIR"
          grep -Fq 'reg = <0x680000 0x6b00000>;' \
            "$OPENWRT_DIR/target/linux/mediatek/dts/mt7986a-ruijie-rg-x60-new-mtkuboot.dts"

      - name: Apply kernel options that defconfig cannot select
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          # These are plain kernel symbols, not OpenWrt CONFIG_KERNEL_* options,
          # so they are appended to the target kernel config. Verified after build.
          # The mediatek target has no top-level config-*; the filogic subtarget
          # config (config-<KERNEL_PATCHVER>) is the last file merged after the
          # generic config, so later lines here override generic defaults.
          patchver=$(sed -n 's/^KERNEL_PATCHVER[[:space:]]*[:?]*=[[:space:]]*//p' \
            target/linux/mediatek/Makefile | head -n1 | tr -d '[:space:]')
          kconf="target/linux/mediatek/filogic/config-${patchver}"
          if [ -z "$patchver" ] || [ ! -f "$kconf" ]; then
            echo "Cannot locate filogic kernel config for KERNEL_PATCHVER=${patchver:-<empty>}" >&2
            exit 1
          fi
          echo "Kernel target config: $kconf"

          # generic/config-6.18 sets CONFIG_DEFAULT_CUBIC=y; override it so the
          # BBR choice is the only default.
          printf '%s\n' \
            '' \
            '# RG-X60 New mainline: TProxy, FQ and BBR (applied by the build workflow).' \
            '# CONFIG_DEFAULT_CUBIC is not set' \
            'CONFIG_NF_TPROXY_IPV4=m' \
            'CONFIG_NFT_TPROXY=m' \
            'CONFIG_NFT_SOCKET=m' \
            'CONFIG_NET_SCH_FQ=y' \
            'CONFIG_TCP_CONG_BBR=y' \
            'CONFIG_DEFAULT_BBR=y' \
            'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$kconf"
          for s in '^CONFIG_NF_TPROXY_IPV4=m$' '^CONFIG_NFT_TPROXY=m$' \
                   '^CONFIG_NFT_SOCKET=m$' '^CONFIG_NET_SCH_FQ=y$' \
                   '^CONFIG_TCP_CONG_BBR=y$' '^CONFIG_DEFAULT_BBR=y$'; do
            grep -Eq "$s" "$kconf"
          done

      - name: Apply first-boot defaults
        shell: bash
        run: |
          set -euo pipefail
          test -f files/etc/config/network
          test -f files/etc/uci-defaults/99-rg-x60-wireless-country
          mkdir -p "$OPENWRT_DIR/files/etc/config" \
            "$OPENWRT_DIR/files/etc/uci-defaults" \
            "$OPENWRT_DIR/files/etc/sysctl.d"
          cp files/etc/config/network "$OPENWRT_DIR/files/etc/config/network"
          install -Dm0755 files/etc/uci-defaults/99-rg-x60-wireless-country \
            "$OPENWRT_DIR/files/etc/uci-defaults/99-rg-x60-wireless-country"
          # Runtime defaults matching the kernel built-in BBR and FQ options.
          # TCP tuning for single-flow proxy throughput. 32 MiB buffers cover a
          # bandwidth-delay product of ~470 Mbit/s x 200 ms (~11.75 MB).
          printf '%s\n' \
            'net.ipv4.tcp_congestion_control=bbr' \
            'net.core.default_qdisc=fq' \
            'net.ipv4.tcp_window_scaling=1' \
            'net.ipv4.tcp_sack=1' \
            'net.core.rmem_max=33554432' \
            'net.core.wmem_max=33554432' \
            'net.ipv4.tcp_rmem=4096 131072 33554432' \
            'net.ipv4.tcp_wmem=4096 65536 33554432' \
            'net.core.netdev_max_backlog=10000' \
            > "$OPENWRT_DIR/files/etc/sysctl.d/90-tcp-tuning.conf"
          # EEE off on the WAN PHY (Airoha EN8811H): EEE on this 2.5G link was
          # associated with link flaps and PPPoE redials. Applied at boot and when
          # eth1 is registered.
          mkdir -p "$OPENWRT_DIR/files/etc/hotplug.d/net"
          printf '%s\n' \
            '#!/bin/sh' \
            '[ "$ACTION" = add ] || exit 0' \
            '[ "$DEVICENAME" = eth1 ] || exit 0' \
            'ethtool --set-eee eth1 eee off >/dev/null 2>&1' \
            > "$OPENWRT_DIR/files/etc/hotplug.d/net/60-eth1-eee-off"
          chmod 0755 "$OPENWRT_DIR/files/etc/hotplug.d/net/60-eth1-eee-off"
          printf '%s\n' \
            '#!/bin/sh' \
            '# Disable EEE on the WAN PHY (see hotplug script).' \
            'ethtool --set-eee eth1 eee off >/dev/null 2>&1 || true' \
            'exit 0' \
            > "$OPENWRT_DIR/files/etc/rc.local"
          chmod 0755 "$OPENWRT_DIR/files/etc/rc.local"
          ! grep -Eq "option (username|password)" "$OPENWRT_DIR/files/etc/config/network"
          grep -Fq "192.168.10.1/24" "$OPENWRT_DIR/files/etc/config/network"

      - name: Update and install feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Remove unused LuCI pages
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/remove-unused-luci-pages.sh "$OPENWRT_DIR"

      - name: Resolve firmware configuration
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          cp ../defconfig/mainline-rg-x60-new-107m.config .config
          make defconfig
          cp .config ../mainline-rg-x60-new-107m.config.full

          grep -E '^CONFIG_TARGET_mediatek_filogic_DEVICE_.*=y$' .config

          # Fail early if a requested OpenWrt symbol was silently dropped by defconfig.
          for s in \
            CONFIG_KERNEL_NETKIT=y \
            CONFIG_KERNEL_KPROBES=y \
            CONFIG_KERNEL_DEBUG_INFO_BTF=y \
            CONFIG_KERNEL_XDP_SOCKETS=y \
            CONFIG_KERNEL_BPF_STREAM_PARSER=y \
            CONFIG_PACKAGE_kmod-tun=y \
            CONFIG_PACKAGE_kmod-nf-tproxy=y \
            CONFIG_PACKAGE_kmod-nft-tproxy=y \
            CONFIG_PACKAGE_kmod-nf-socket=y \
            CONFIG_PACKAGE_kmod-nft-socket=y \
            CONFIG_PACKAGE_kmod-veth=y; do
            grep -Fqx "$s" .config || { echo "Missing in resolved config: $s" >&2; exit 1; }
          done

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=4G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Download package sources
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if ! CCACHE_DISABLE=1 make download -j8; then
            find dl -type f -size -1024c -delete || true
            CCACHE_DISABLE=1 make download -j2
          fi
          du -sh dl

      - name: Save source download cache
        if: ${{ always() && steps.dl-cache.outputs.cache-hit != 'true' && hashFiles('openwrt/dl/*') != '' }}
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}

      - name: Build firmware
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee ../build.log

      - name: Verify final kernel options
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          kernel_config=$(find build_dir -type f -path '*/linux-mediatek_filogic/linux-*/.config' -print -quit)
          test -n "$kernel_config"
          check() {
            grep -Eq "$1" "$kernel_config" || { echo "Kernel option check failed: $1" >&2; exit 1; }
          }
          check '^CONFIG_TCP_CONG_BBR=y$'
          check '^CONFIG_DEFAULT_TCP_CONG="bbr"$'
          check '^CONFIG_NET_SCH_FQ=y$'
          check '^CONFIG_NF_TPROXY_IPV4=m$'
          check '^CONFIG_NFT_TPROXY=m$'
          check '^CONFIG_NFT_SOCKET=m$'
          check '^CONFIG_NETKIT=y$'
          check '^CONFIG_TUN=m$'
          check '^CONFIG_BPF_JIT=y$'
          check '^CONFIG_BPF_SYSCALL=y$'
          check '^CONFIG_KPROBES=y$'
          check '^CONFIG_XDP_SOCKETS=y$'
          check '^CONFIG_DEBUG_INFO_BTF=y$'
          check '^CONFIG_NET_CLS_BPF=m$'
          check '^CONFIG_NET_CLS_ACT=y$'
          echo "All requested kernel options are present."

          # The TCP buffer defaults must be in the rootfs, not only in files/.
          sysctl_conf=$(find build_dir -type f -path '*/root-mediatek*/etc/sysctl.d/90-tcp-tuning.conf' -print -quit)
          test -n "$sysctl_conf" || { echo "90-tcp-tuning.conf missing from rootfs" >&2; exit 1; }
          for line in 'net.core.rmem_max=33554432' \
            'net.core.wmem_max=33554432' \
            'net.ipv4.tcp_rmem=4096 131072 33554432' \
            'net.ipv4.tcp_wmem=4096 65536 33554432' \
            'net.core.netdev_max_backlog=10000'; do
            grep -Fxq "$line" "$sysctl_conf" || { echo "sysctl line missing in rootfs: $line" >&2; exit 1; }
          done
          echo "TCP buffer sysctl defaults are present in the rootfs: $sysctl_conf"
          for f in etc/hotplug.d/net/60-eth1-eee-off etc/rc.local usr/sbin/ethtool; do
            test -n "$(find build_dir -path "*/root-mediatek*/$f" -print -quit)" \
              || { echo "$f missing from rootfs" >&2; exit 1; }
          done
          echo "EEE-off boot hooks and ethtool are present in the rootfs."


      - name: Collect firmware artifacts
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          . ../source-info.env

          image=$(find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            -name '*ruijie_rg-x60-new-mtkuboot-squashfs-sysupgrade.bin' -print -quit)
          initramfs=$(find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            -name '*ruijie_rg-x60-new-mtkuboot-initramfs-kernel.bin' -print -quit)
          test -n "$image"
          test -n "$initramfs"

          mkdir -p ../artifacts
          kernel_config=$(find build_dir -type f \
            -path '*/linux-mediatek_filogic/linux-*/.config' -print -quit)
          if [ -n "$kernel_config" ]; then
            cp "$kernel_config" ../artifacts/kernel.config
          else
            printf '%s\n' 'Final kernel .config was not located.' > ../artifacts/KERNEL-CONFIG-NOT-FOUND.txt
          fi

          cp "$image" "../artifacts/RG-X60-New-mainline-107M-sysupgrade.bin"
          cp "$initramfs" "../artifacts/RG-X60-New-mainline-107M-initramfs-kernel.bin"

          manifest=$(find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            -name '*ruijie_rg-x60-new-mtkuboot*.manifest' -print -quit || true)
          if [ -n "$manifest" ]; then
            cp "$manifest" ../artifacts/
          fi

          cp "../mainline-rg-x60-new-107m.config.full" ../artifacts/config.full
          cp bin/targets/mediatek/filogic/sha256sums ../artifacts/upstream-sha256sums
          {
            echo "source_repository=$OPENWRT_REPO"
            echo "source_branch=$OPENWRT_BRANCH"
            echo "source_commit=$SOURCE_COMMIT"
            echo "device_profile=$PROFILE"
            echo "firmware_profile=ebpf-tproxy-tun-bbr"
            echo "compatible=ruijie,rg-x60-new-mtkuboot"
            echo "ubi_offset=0x680000"
            echo "ubi_size=0x6b00000"
            echo "ubi_size_mib=107"
            echo "fip_changed=false"
          } > ../artifacts/BUILD-INFO.txt
          (
            cd ../artifacts
            sha256sum *.bin > SHA256SUMS
            ls -lh
          )

      - name: Show ccache statistics
        if: always()
        shell: bash
        run: ccache --show-stats || true

      - name: Save host tools and toolchain cache
        if: ${{ always() && inputs.clean_build == false && steps.toolchain-cache.outputs.cache-hit != 'true' && hashFiles('openwrt/staging_dir/host/stamp/*', 'openwrt/staging_dir/toolchain-*/stamp/*') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/toolchain-*
          key: mainline-rgx60new-107m-toolchain-${{ runner.os }}-${{ steps.source.outputs.sha }}-${{ hashFiles('defconfig/mainline-rg-x60-new-107m.config') }}

      - name: Save compiler cache
        if: ${{ always() && inputs.clean_build == false && hashFiles('openwrt/.ccache/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: mainline-rgx60new-107m-ccache-${{ runner.os }}-${{ steps.source.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Debug SSH on failure
        if: ${{ failure() && inputs.ssh_debug == true }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 60

      - name: Upload firmware and verification files
        uses: actions/upload-artifact@v4
        with:
          name: RG-X60-New-mainline-107M-${{ steps.source.outputs.short_sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RG-X60-New-mainline-107M-failure-logs-${{ github.run_number }}
          path: |
            build.log
            mainline-rg-x60-new-107m.config.full
            openwrt/.config
            openwrt/logs/
          if-no-files-found: ignore
          retention-days: 14
